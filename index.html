<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encore Pro · Internal Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:         #212E1D;
      --green-2:       #374931;
      --green-3:       #536B4B;
      --gold:          #CD9B49;
      --gold-light:    #DCB26D;
      --cream:         #FFF8EC;
      --cream-3:       #F5F0E4;
      --error:         #582727;
      --surface:       #ffffff;
      --border:        rgba(33,46,29,.12);
      --border-mid:    rgba(33,46,29,.22);
      --border-strong: rgba(33,46,29,.35);
      --text-1:        #212E1D;
      --text-2:        #4a5c44;
      --text-3:        #7a8c74;
      --serif: 'Nanum Myeongjo', Georgia, serif;
      --sans:  'Albert Sans', system-ui, sans-serif;
      --r: 6px; --r-lg: 10px;
    }
    html, body { min-height:100%; background:var(--cream); color:var(--text-1); font-family:var(--sans); font-size:14px; line-height:1.5; }
    .shell { display:flex; flex-direction:column; min-height:100vh; }

    /* Header */
    header { display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:58px; background:var(--green); border-bottom:1px solid var(--green-2); position:sticky; top:0; z-index:100; }
    .logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .logo-wordmark { font-size:15px; font-weight:600; color:var(--cream); letter-spacing:.01em; }
    .logo-sep { color:var(--green-3); margin:0 4px; font-weight:300; }
    .logo-sub { font-size:13px; font-weight:400; color:rgba(255,248,236,.55); }
    .header-right { display:flex; align-items:center; gap:8px; }

    /* Buttons */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--r); font-family:var(--sans); font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; border:1px solid transparent; line-height:1; }
    .btn-ghost-light { background:transparent; color:rgba(255,248,236,.7); border-color:rgba(255,248,236,.2); }
    .btn-ghost-light:hover { background:rgba(255,248,236,.1); color:var(--cream); border-color:rgba(255,248,236,.35); }
    .btn-green { background:var(--green); color:var(--cream); border-color:var(--green); font-weight:600; }
    .btn-green:hover { background:var(--green-2); }
    .btn-outline { background:transparent; color:var(--text-2); border-color:var(--border-mid); }
    .btn-outline:hover { background:var(--cream-3,#F5F0E4); color:var(--text-1); border-color:var(--border-strong); }
    .btn-danger { background:transparent; color:var(--error); border-color:rgba(88,39,39,.3); font-size:11px; padding:4px 10px; }
    .btn-danger:hover { background:rgba(88,39,39,.06); }
    .btn-sm { padding:5px 10px; font-size:12px; }

    /* Main */
    main { flex:1; padding:36px 28px; max-width:1120px; width:100%; margin:0 auto; }

    /* Tabs */
    .tabs { display:flex; gap:2px; background:rgba(33,46,29,.07); padding:3px; border-radius:var(--r-lg); border:1px solid var(--border-mid); width:fit-content; margin-bottom:36px; flex-wrap:wrap; }
    .tab { padding:8px 18px; border-radius:7px; font-size:13px; font-weight:500; color:var(--text-2); cursor:pointer; transition:all .15s; border:1px solid transparent; background:transparent; font-family:var(--sans); white-space:nowrap; }
    .tab:hover { color:var(--green); background:rgba(33,46,29,.05); }
    .tab.active { background:var(--green); color:var(--cream); border-color:var(--green); box-shadow:0 1px 4px rgba(33,46,29,.2); }

    /* Section headers */
    .section-group { margin-bottom:32px; }
    .section-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .section-header-line { flex:1; height:1px; background:var(--border-mid); }
    .section-header-label { font-family:var(--serif); font-size:13px; font-weight:700; color:var(--text-3); letter-spacing:.04em; white-space:nowrap; }

    /* Grid */
    .bookmark-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
    .bookmark-card { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--surface); border:1px solid var(--border-mid); border-radius:var(--r-lg); text-decoration:none; color:var(--text-1); transition:all .15s; min-width:0; box-shadow:0 1px 3px rgba(33,46,29,.06); }
    .bookmark-card:hover { border-color:var(--green); box-shadow:0 3px 12px rgba(33,46,29,.12); transform:translateY(-1px); }
    .bookmark-icon { width:36px; height:36px; border-radius:8px; background:#F5F0E4; border:1px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .bookmark-icon img { width:24px; height:24px; object-fit:contain; }
    .bookmark-icon .fallback { font-size:18px; color:var(--green); line-height:1; }
    .bookmark-info { min-width:0; flex:1; }
    .bookmark-name { font-weight:600; font-size:13px; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bookmark-url  { font-size:11px; font-family:monospace; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
    .bookmark-arrow { flex-shrink:0; color:var(--gold); opacity:0; transition:opacity .15s; }
    .bookmark-card:hover .bookmark-arrow { opacity:1; }
    .empty-state { text-align:center; padding:72px 20px; color:var(--text-3); font-size:13px; }
    .empty-state strong { display:block; color:var(--text-2); margin-bottom:6px; font-size:15px; font-family:var(--serif); }

    /* Admin overlay */
    .admin-overlay { position:fixed; inset:0; background:rgba(33,46,29,.45); backdrop-filter:blur(3px); z-index:200; display:none; align-items:flex-start; justify-content:flex-end; }
    .admin-overlay.open { display:flex; }
    .admin-panel { width:560px; max-width:100vw; height:100vh; background:var(--cream); border-left:1px solid var(--border-mid); display:flex; flex-direction:column; overflow:hidden; animation:slideIn .2s ease; }
    @keyframes slideIn { from{transform:translateX(24px);opacity:0} to{transform:translateX(0);opacity:1} }
    .admin-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border-mid); background:var(--green); flex-shrink:0; }
    .admin-title { font-size:13px; font-weight:600; color:var(--cream); letter-spacing:.04em; }
    .admin-body { flex:1; overflow-y:auto; padding:22px 24px; background:var(--cream); }

    /* Admin tabs */
    .admin-tabs { display:flex; gap:2px; background:rgba(33,46,29,.07); padding:3px; border-radius:var(--r-lg); border:1px solid var(--border-mid); margin-bottom:22px; }
    .admin-tab { flex:1; padding:7px; border-radius:7px; font-size:12px; font-weight:600; color:var(--text-2); cursor:pointer; transition:all .15s; border:1px solid transparent; background:transparent; font-family:var(--sans); text-align:center; }
    .admin-tab:hover { color:var(--green); }
    .admin-tab.active { background:var(--green); color:var(--cream); border-color:var(--green); }

    /* Token gate */
    .token-gate { text-align:center; padding:32px 20px; }
    .token-gate p { font-size:13px; color:var(--text-2); margin-bottom:16px; line-height:1.6; }
    .token-gate input { width:100%; padding:9px 12px; background:var(--surface); border:1px solid var(--border-mid); border-radius:var(--r); color:var(--text-1); font-family:monospace; font-size:12px; outline:none; margin-bottom:10px; }
    .token-gate input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(33,46,29,.08); }
    .token-error { font-size:12px; color:var(--error); margin-top:6px; display:none; }

    /* Form */
    .form-card { background:var(--surface); border:1px solid var(--border-mid); border-radius:var(--r-lg); padding:20px; margin-bottom:22px; box-shadow:0 1px 4px rgba(33,46,29,.06); }
    .form-card-title { font-family:var(--serif); font-size:15px; font-weight:700; color:var(--green); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border); }
    .form-row { margin-bottom:13px; }
    label { display:block; font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:5px; letter-spacing:.02em; text-transform:uppercase; }
    input[type="text"], input[type="url"], select { width:100%; padding:9px 12px; background:var(--cream); border:1px solid var(--border-mid); border-radius:var(--r); color:var(--text-1); font-family:var(--sans); font-size:13px; outline:none; transition:border-color .15s,box-shadow .15s; }
    input[type="text"]:focus, input[type="url"]:focus, select:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(33,46,29,.08); }
    select option { background:#fff; }
    input[type="file"] { font-family:var(--sans); font-size:12px; color:var(--text-2); cursor:pointer; }
    .icon-source-tabs { display:flex; margin-bottom:10px; border:1px solid var(--border-mid); border-radius:var(--r); overflow:hidden; width:fit-content; }
    .icon-source-tab { padding:5px 12px; font-size:12px; font-weight:500; font-family:var(--sans); background:transparent; border:none; cursor:pointer; color:var(--text-2); transition:all .12s; border-right:1px solid var(--border-mid); }
    .icon-source-tab:last-child { border-right:none; }
    .icon-source-tab.active { background:var(--green); color:var(--cream); }
    .icon-input-panel { display:none; }
    .icon-input-panel.active { display:block; }
    .icon-preview-row { display:flex; align-items:center; gap:12px; margin-top:10px; }
    .icon-preview-box { width:40px; height:40px; border-radius:8px; background:#F5F0E4; border:1px solid var(--border-mid); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
    .icon-preview-box img { width:26px; height:26px; object-fit:contain; }
    .icon-preview-box .fallback { font-size:20px; color:var(--green); line-height:1; }
    .icon-preview-status { font-size:12px; color:var(--text-3); }
    .checkbox-group { display:flex; flex-wrap:wrap; gap:6px; }
    .cat-toggle { display:flex; align-items:center; gap:5px; cursor:pointer; padding:5px 11px; background:var(--cream); border:1px solid var(--border-mid); border-radius:20px; font-size:12px; font-weight:500; color:var(--text-2); transition:all .15s; user-select:none; }
    .cat-toggle:hover { border-color:var(--green); color:var(--green); }
    .cat-toggle.checked { background:var(--green); border-color:var(--green); color:var(--cream); }
    .cat-toggle input { display:none; }
    .form-actions { display:flex; gap:8px; margin-top:18px; }
    .save-status { font-size:12px; color:var(--text-3); margin-top:8px; min-height:18px; }
    .save-status.ok  { color:#1e7d4a; }
    .save-status.err { color:var(--error); }

    /* Admin bookmark list */
    .list-filter { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:14px; }
    .filter-chip { padding:4px 11px; border-radius:20px; font-size:11px; font-weight:600; font-family:var(--sans); border:1px solid var(--border-mid); background:transparent; color:var(--text-3); cursor:pointer; transition:all .15s; }
    .filter-chip.active { background:var(--green); border-color:var(--green); color:var(--cream); }
    .bm-row { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); margin-bottom:5px; transition:border-color .15s; }
    .bm-row:hover { border-color:var(--border-mid); }
    .bm-row.drag-over { border-color:var(--gold); box-shadow:0 0 0 2px rgba(205,155,73,.2); }
    .bm-row.dragging  { opacity:.4; }
    .drag-handle { cursor:grab; color:var(--text-3); flex-shrink:0; display:flex; align-items:center; }
    .drag-handle:active { cursor:grabbing; }
    .bm-icon { width:26px; height:26px; border-radius:5px; background:#F5F0E4; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
    .bm-icon img { width:16px; height:16px; object-fit:contain; }
    .bm-icon .fallback { font-size:12px; color:var(--green); line-height:1; }
    .bm-info { flex:1; min-width:0; }
    .bm-name   { font-size:13px; font-weight:600; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bm-meta   { font-size:10px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bm-section-pip { font-size:10px; font-weight:600; padding:2px 7px; border-radius:20px; background:rgba(205,155,73,.12); color:#8a6520; border:1px solid rgba(205,155,73,.3); flex-shrink:0; white-space:nowrap; }
    .bm-actions { display:flex; gap:3px; flex-shrink:0; }
    .icon-btn { width:28px; height:28px; border-radius:5px; background:transparent; border:1px solid transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-3); transition:all .15s; }
    .icon-btn:hover { background:#F5F0E4; border-color:var(--border); color:var(--text-1); }
    .icon-btn.del:hover { color:var(--error); border-color:rgba(88,39,39,.25); background:rgba(88,39,39,.05); }

    /* Section manager */
    .section-item { display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); margin-bottom:6px; }
    .section-item-name { flex:1; font-size:13px; font-weight:500; color:var(--text-1); }
    .section-item-count { font-size:11px; color:var(--text-3); }
    .section-edit-row { display:flex; gap:6px; margin-bottom:14px; }
    .section-edit-row input { flex:1; }

    .divider { border:none; border-top:1px solid var(--border-mid); margin:20px 0; }
    .panel-label { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }

    /* Toast */
    #toast-container { position:fixed; bottom:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:6px; }
    .toast { padding:10px 16px; background:var(--green); border:1px solid var(--green-2); border-radius:var(--r); font-size:13px; font-weight:500; color:var(--cream); animation:toastIn .2s ease; }
    @keyframes toastIn { from{transform:translateY(8px);opacity:0} to{transform:translateY(0);opacity:1} }

    @media(max-width:600px) { .admin-panel{width:100vw} main{padding:20px 16px} header{padding:0 16px} .tabs{flex-wrap:wrap} }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <a href="/" class="logo">
      <span style="color:#CD9B49;font-size:20px;line-height:1;">✦</span>
      <span>
        <span class="logo-wordmark">Encore Pro</span>
        <span class="logo-sep">/</span>
        <span class="logo-sub">Internal Links</span>
      </span>
    </a>
    <div class="header-right">
      <button class="btn btn-ghost-light" onclick="openAdmin()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M11.54 3.05l-1.41 1.41M4.46 11.54l-1.41 1.41"/></svg>
        Admin
      </button>
    </div>
  </header>

  <main>
    <div class="tabs" id="tabs"></div>
    <div id="main-content"></div>
  </main>
</div>

<!-- Admin panel -->
<div class="admin-overlay" id="admin-overlay" onclick="handleOverlayClick(event)">
  <div class="admin-panel">
    <div class="admin-header">
      <span class="admin-title" id="admin-title">Admin</span>
      <button class="btn btn-ghost-light btn-sm" onclick="closeAdmin()">✕ Close</button>
    </div>
    <div class="admin-body" id="admin-body"></div>
  </div>
</div>
<div id="toast-container"></div>

<script>
/* ── Config ── */
const GITHUB_OWNER  = 'alex-cutrone';
const GITHUB_REPO   = 'encore-pro-bookmarks';
const GITHUB_FILE   = 'bookmarks.json';
const CONFIG_FILE   = 'config.json';
const GH_TOKEN      = atob('Z2l0aHViX3BhdF8xMUJQTzNES0kwQ2ljTHhlU0tVcnQ4X2toR2hsZUVBZkViU2owYjN2WExONGpQNVlJWVhNOTQ0SmtseGVJZjM2UFM0WkFTWFlDSTZBS1N0WUt3Qg==');
const RAW_BASE      = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main`;
const RAW_URL       = `${RAW_BASE}/${GITHUB_FILE}`;
const CONFIG_URL    = `${RAW_BASE}/${CONFIG_FILE}`;
const API_URL       = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
const CONFIG_API    = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${CONFIG_FILE}`;
const PASS_KEY      = 'ep_admin_unlocked';
const CATEGORIES    = ['Product', 'Growth', 'Operations', 'Client Success'];
const DEFAULT_SECTIONS = ['Google Workspace', 'crowdEngage', 'Documentation', 'HR & Operations', 'Project Management', 'General'];

let bookmarks    = [];
let sections     = [...DEFAULT_SECTIONS];
let fileSha      = null;
let editingId    = null;
let activeTab    = 'all';
let adminFilter  = 'all';
let adminView    = 'bookmarks'; // 'bookmarks' | 'sections'
let iconSource   = 'auto';
let customIconData = null;
let dragSrcId    = null;

/* ── Helpers ── */
function uid()    { return Math.random().toString(36).slice(2,10); }
function esc(s)   { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getDomain(url) { return url.trim().replace(/^https?:\/\//i,'').split('/')[0]; }
let adminPassword = null; // loaded from config.json

async function loadConfig() {
  try {
    const res = await fetch(CONFIG_URL + '?t=' + Date.now());
    if (res.ok) { const cfg = await res.json(); adminPassword = cfg.password || null; }
  } catch {}
}

function isUnlocked()  { return sessionStorage.getItem(PASS_KEY) === '1'; }
function setUnlocked() { sessionStorage.setItem(PASS_KEY, '1'); }
function lockAdmin()   { sessionStorage.removeItem(PASS_KEY); }

function resolvedIcon(b) {
  if (b.customIcon) return b.customIcon;
  const d = getDomain(b.url);
  return d ? `https://www.google.com/s2/favicons?domain=${d}&sz=64` : null;
}
function fallbackHtml() { return `<span class="fallback">✦</span>`; }
function isGlobe(img) {
  if (img.naturalWidth <= 16 && img.naturalHeight <= 16) return true;
  try {
    const c = document.createElement('canvas');
    c.width = c.height = img.naturalWidth||16;
    const ctx = c.getContext('2d');
    ctx.drawImage(img,0,0);
    const [r,g,b,a] = ctx.getImageData(Math.floor(c.width/2),Math.floor(c.height/2),1,1).data;
    if (a<30) return true;
    return b>r && b>g && b>100 && r>80 && r<200 && g>90 && g<210;
  } catch { return false; }
}
function checkGlobe(img) {
  if (isGlobe(img)) img.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'✦'}));
}
function imgHtml(src,size) {
  return `<img src="${src}" width="${size}" height="${size}" style="object-fit:contain" alt=""
    onload="checkGlobe(this)"
    onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'✦'}))" />`;
}
function getSection(b) { return b.section || 'General'; }

/* ── GitHub ── */
async function fetchBookmarks() {
  await loadConfig();
  try {
    const res = await fetch(RAW_URL+'?t='+Date.now());
    if (!res.ok) throw new Error();
    const data = await res.json();
    bookmarks = data;
    // Extract any sections found in data that aren't in defaults
    const found = [...new Set(bookmarks.map(b=>b.section).filter(Boolean))];
    found.forEach(s=>{ if(!sections.includes(s)) sections.push(s); });
  } catch {
    bookmarks = [];
  }
  renderTabs();
  renderMain();
}

async function pushData(message) {
  const token = GH_TOKEN;
  // Fetch current SHA
  const metaRes = await fetch(API_URL, { headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'} });
  if (!metaRes.ok) throw new Error(`Auth ${metaRes.status}`);
  const meta = await metaRes.json();
  fileSha = meta.sha;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(bookmarks,null,2))));
  const putRes  = await fetch(API_URL, {
    method:'PUT',
    headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({message,content,sha:fileSha})
  });
  if (!putRes.ok) { const e=await putRes.json(); throw new Error(e.message||putRes.status); }
  fileSha = (await putRes.json()).content.sha;
}

async function doSave(message) {
  const st = document.getElementById('save-status');
  if (st) { st.textContent='Saving…'; st.className='save-status'; }
  try {
    await pushData(message);
    if (st) { st.textContent='Saved ✓'; st.className='save-status ok'; setTimeout(()=>{if(st)st.textContent='';},3000); }
  } catch(e) {
    if (st) { st.textContent=`Save failed: ${e.message}`; st.className='save-status err'; }
    if (e.message.includes('401')||e.message.includes('Auth')) { lockAdmin(); renderPasswordGate(); }
  }
}

/* ── Main render ── */
function renderTabs() {
  document.getElementById('tabs').innerHTML = ['all',...CATEGORIES].map(cat=>{
    const hash = catToHash(cat);
    return `<a class="tab ${activeTab===cat?'active':''}" href="${hash?'#'+hash:'#'}"
      onclick="event.preventDefault();setTab('${cat}')">${cat==='all'?'All':cat}</a>`;
  }).join('');
}
function catToHash(cat) { return cat === 'all' ? '' : cat.toLowerCase().replace(/\s+/g, '-'); }
function hashToCat(hash) {
  if (!hash || hash === '#') return 'all';
  const h = hash.replace('#','').toLowerCase();
  return ['all',...CATEGORIES].find(c => c.toLowerCase().replace(/\s+/g,'-') === h) || 'all';
}
function setTab(cat, pushState=true) {
  activeTab=cat;
  if (pushState) {
    const hash = catToHash(cat);
    history.pushState(null, '', hash ? '#'+hash : location.pathname + location.search);
  }
  renderTabs(); renderMain();
}

function renderMain() {
  const el = document.getElementById('main-content');
  const list = activeTab==='all' ? bookmarks : bookmarks.filter(b=>b.categories.includes(activeTab));

  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><strong>Nothing here.</strong>Open Admin to add bookmarks.</div>`;
    return;
  }

  // Group by section, preserving section order
  const grouped = {};
  sections.forEach(s => grouped[s] = []);
  grouped['General'] = grouped['General'] || [];
  list.forEach(b => {
    const s = getSection(b);
    if (!grouped[s]) grouped[s] = [];
    grouped[s].push(b);
  });

  // Render only sections that have bookmarks
  const orderedSections = sections.filter(s => grouped[s] && grouped[s].length > 0);
  // Also catch any section not in our list
  Object.keys(grouped).forEach(s => { if (!orderedSections.includes(s) && grouped[s].length) orderedSections.push(s); });

  el.innerHTML = orderedSections.map(sectionName => {
    const items = grouped[sectionName];
    const cards = items.map(b => {
      const src  = resolvedIcon(b);
      const href = b.url.startsWith('http') ? b.url : 'https://'+b.url;
      return `<a class="bookmark-card" href="${esc(href)}" target="_blank" rel="noopener">
        <div class="bookmark-icon">${src?imgHtml(src,24):fallbackHtml()}</div>
        <div class="bookmark-info">
          <div class="bookmark-name">${esc(b.name)}</div>
          <div class="bookmark-url">${esc(getDomain(b.url))}</div>
        </div>
        <svg class="bookmark-arrow" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </a>`;
    }).join('');

    return `<div class="section-group">
      <div class="section-header">
        <div class="section-header-line"></div>
        <div class="section-header-label">${esc(sectionName)}</div>
        <div class="section-header-line"></div>
      </div>
      <div class="bookmark-grid">${cards}</div>
    </div>`;
  }).join('');
}

async function savePassword() {
  const p1 = document.getElementById('new-pass-1').value;
  const p2 = document.getElementById('new-pass-2').value;
  const st = document.getElementById('save-status');
  if (!p1) { st.textContent='Enter a password.'; st.className='save-status err'; return; }
  if (p1 !== p2) { st.textContent='Passwords do not match.'; st.className='save-status err'; return; }
  st.textContent='Saving…'; st.className='save-status';
  try {
    // Fetch current config SHA
    const metaRes = await fetch(CONFIG_API, {
      headers:{Authorization:`token ${GH_TOKEN}`,Accept:'application/vnd.github.v3+json'}
    });
    const meta = await metaRes.json();
    const newCfg = JSON.stringify({password: p1}, null, 2);
    const content = btoa(unescape(encodeURIComponent(newCfg)));
    const putRes = await fetch(CONFIG_API, {
      method:'PUT',
      headers:{Authorization:`token ${GH_TOKEN}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'Update admin password',content,sha:meta.sha})
    });
    if (!putRes.ok) throw new Error();
    adminPassword = p1;
    document.getElementById('new-pass-1').value='';
    document.getElementById('new-pass-2').value='';
    st.textContent='Password updated ✓'; st.className='save-status ok';
    setTimeout(()=>{if(st)st.textContent='';},3000);
  } catch {
    st.textContent='Save failed.'; st.className='save-status err';
  }
}

function addSection() {
  const inp = document.getElementById('new-section-name');

  sections.push(name);
  inp.value='';
  renderSectionsView();
  renderMain();
  toast(`Added section "${name}"`);
}

function startRename(i, current) {
  const label = document.getElementById(`sec-label-${i}`);
  const item  = document.getElementById(`sec-item-${i}`);
  if (!label) return;
  label.innerHTML = `<input type="text" id="rename-input-${i}"
    value="${current.replace(/"/g,'&quot;')}"
    style="width:100%;padding:3px 6px;border:1px solid var(--green);border-radius:4px;font-size:13px;font-family:var(--sans);background:var(--cream);color:var(--text-1);outline:none;"
    onkeydown="if(event.key==='Enter')commitRename(${i},'${current.replace(/'/g,String.fromCharCode(92,39))}');if(event.key==='Escape')renderSectionsView();"
    onblur="commitRename(${i},'${current.replace(/'/g,String.fromCharCode(92,39))}')"/>`;
  const inp = document.getElementById(`rename-input-${i}`);
  if (inp) { inp.focus(); inp.select(); }
  item.setAttribute('draggable','false');
}

function commitRename(i, oldName) {
  const inp = document.getElementById(`rename-input-${i}`);
  if (!inp) return;
  const newName = inp.value.trim();
  if (!newName || newName === oldName) { renderSectionsView(); return; }
  if (sections.includes(newName)) { toast('A section with that name already exists.'); renderSectionsView(); return; }
  sections[i] = newName;
  bookmarks.forEach(b => { if (b.section === oldName) b.section = newName; });
  renderSectionsView(); renderMain();
  doSave(`Rename section: "${oldName}" to "${newName}"`);
  toast(`Renamed to "${newName}"`);
}

function deleteSection(name) {
  if (!confirm(`Delete section "${name}"? Bookmarks in it will move to General.`)) return;
  bookmarks.forEach(b=>{ if(b.section===name) b.section='General'; });
  sections = sections.filter(s=>s!==name);
  renderSectionsView(); renderMain();
  doSave(`Delete section: ${name}`);
  toast(`Deleted "${name}"`);
}

/* ── Icon source ── */
function setIconSource(src,btn) {
  iconSource=src; customIconData=null;

  document.querySelectorAll('.icon-input-panel').forEach(p=>p.classList.remove('active'));

let iconTimer=null,customIconTimer=null;
function onUrlInput() { if(iconSource==='auto'){clearTimeout(iconTimer);iconTimer=setTimeout(triggerAutoPreview,600);} }
function triggerAutoPreview() {
  const url=document.getElementById('f-url')?.value.trim();
  const box=document.getElementById('icon-preview-box'); const status=document.getElementById('icon-preview-status');
  if(!url||!box){resetIconPreview();return;}
  const src=`https://www.google.com/s2/favicons?domain=${getDomain(url)}&sz=64`;
  const img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{
    if(isGlobe(img)){box.innerHTML=fallbackHtml();status.textContent='No icon — ✦ will be used';status.style.color='var(--text-3)';}
    else{box.innerHTML=`<img src="${src}" width="26" height="26" style="object-fit:contain" alt=""/>`;status.textContent='Icon found';status.style.color='#1e7d4a';}
  };
  img.onerror=()=>{box.innerHTML=fallbackHtml();status.textContent='No icon — ✦ will be used';status.style.color='var(--text-3)';};
  img.src=src;
}
function debounceCustomIconPreview(){clearTimeout(customIconTimer);customIconTimer=setTimeout(previewCustomUrl,500);}
function previewCustomUrl(){
  const val=document.getElementById('f-icon-url')?.value.trim();
  const box=document.getElementById('icon-preview-box'); const st=document.getElementById('icon-preview-status');

  img.onerror=()=>{box.innerHTML=fallbackHtml();st.textContent="Couldn't load that URL";st.style.color='var(--error)';customIconData=null;};
  img.src=val;
}

    document.getElementById('icon-preview-status').textContent='File ready';

  reader.readAsDataURL(file);

function resetIconPreview(){
  const box=document.getElementById('icon-preview-box'); const st=document.getElementById('icon-preview-status');

/* ── Save/Edit/Delete ── */
function saveBookmark(){
  const name=document.getElementById('f-name').value.trim();
  const url =document.getElementById('f-url').value.trim();
  const sec  =document.getElementById('f-section').value;
  const cats =getSelectedCats();
  if(!name||!url){toast('Name and URL are required.');return;}
  if(!cats.length){toast('Select at least one category.');return;}
  const finalIcon=(iconSource==='url'||iconSource==='upload')?customIconData||null:null;
  if(editingId){
    const i=bookmarks.findIndex(b=>b.id===editingId);
    if(i!==-1){bookmarks[i]={...bookmarks[i],name,url,section:sec,categories:cats};if(iconSource==='auto')delete bookmarks[i].customIcon;else if(finalIcon)bookmarks[i].customIcon=finalIcon;}
    toast(`Updated "${name}"`); doSave(`Update: ${name}`);
  } else {
    const entry={id:uid(),name,url,section:sec,categories:cats};
    if(finalIcon) entry.customIcon=finalIcon;
    bookmarks.push(entry);
    toast(`Added "${name}"`); doSave(`Add: ${name}`);
  }
  resetForm(); renderAdminList(); renderMain();
}

function editBookmark(id){
  const b=bookmarks.find(x=>x.id===id); if(!b) return;
  editingId=id;
  document.getElementById('f-name').value=b.name;
  document.getElementById('f-url').value=b.url;
  document.getElementById('f-section').value=getSection(b);
  document.getElementById('form-section-title').textContent='Edit Bookmark';
  document.getElementById('cancel-btn').style.display='inline-flex';
  buildCatBoxes(b.categories);
  if(b.customIcon){
    const isUrl=b.customIcon.startsWith('http');
    const btn=document.querySelector(`.icon-source-tab:nth-child(${isUrl?2:3})`);
    setIconSource(isUrl?'url':'upload',btn);
    if(isUrl) document.getElementById('f-icon-url').value=b.customIcon;
    document.getElementById('icon-preview-box').innerHTML=`<img src="${b.customIcon}" width="26" height="26" style="object-fit:contain" alt=""/>`;
    document.getElementById('icon-preview-status').textContent='Custom icon active';
    document.getElementById('icon-preview-status').style.color='#1e7d4a';
    customIconData=b.customIcon;
  } else {
    setIconSource('auto',document.querySelector('.icon-source-tab:first-child'));
    triggerAutoPreview();
  }
  document.getElementById('f-name').focus();
  document.querySelector('.admin-body').scrollTo({top:0,behavior:'smooth'});
}

function deleteBookmark(id){
  const b=bookmarks.find(x=>x.id===id);
  if(!b||!confirm(`Remove "${b.name}"?`)) return;
  bookmarks=bookmarks.filter(x=>x.id!==id);
  renderAdminList(); renderMain();
  toast(`Removed "${b.name}"`); doSave(`Remove: ${b.name}`);
}

function resetForm(){
  editingId=null;
  ['f-name','f-url','f-icon-url','f-icon-file'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const fst=document.getElementById('form-section-title'); if(fst) fst.textContent='Add Bookmark';
  const cb=document.getElementById('cancel-btn'); if(cb) cb.style.display='none';
  customIconData=null;
  const autoBtn=document.querySelector('.icon-source-tab:first-child'); if(autoBtn) setIconSource('auto',autoBtn);
  resetIconPreview(); buildCatBoxes([]);
}

function signOut(){ lockAdmin(); renderPasswordGate(); }

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.remove(),2600);
}

// Read hash on load
window.addEventListener('popstate', () => {
  activeTab = hashToCat(location.hash);
  renderTabs(); renderMain();
});
activeTab = hashToCat(location.hash);
fetchBookmarks();
</script>
</body>
</html>
