<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encore Pro · Internal Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Encore Pro brand palette — exact spec */
      --green:       #212E1D;   /* Encore Pro Green — leads */
      --green-2:     #374931;   /* secondary green */
      --green-3:     #536B4B;   /* mid green for borders on green bg */
      --gold:        #CD9B49;   /* Encore Pro Gold — accents */
      --gold-light:  #DCB26D;
      --cream:       #FFF8EC;   /* Encore Pro White — supports */
      --cream-2:     #ECD5B0;   /* warm secondary surface */
      --cream-3:     #F5F0E4;   /* card background on cream page */
      --error:       #582727;   /* burgundy — error states only */

      /* Semantic tokens */
      --bg:          var(--cream);
      --surface:     #ffffff;
      --surface-2:   var(--cream-3);
      --border:      rgba(33,46,29,.12);
      --border-mid:  rgba(33,46,29,.22);
      --border-strong: rgba(33,46,29,.35);
      --text-1:      var(--green);
      --text-2:      #4a5c44;
      --text-3:      #7a8c74;

      --serif:  'Nanum Myeongjo', Georgia, serif;
      --sans:   'Albert Sans', system-ui, sans-serif;
      --r:      6px;
      --r-lg:   10px;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-1);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
    }

    .shell { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Header ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 58px;
      background: var(--green);
      border-bottom: 1px solid var(--green-2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    /* Encore Pro E emblem — 4-pointed star / diamond lattice approximation */
    .logo-emblem {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    .logo-wordmark {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--cream);
      letter-spacing: .01em;
    }

    .logo-sep {
      color: var(--green-3);
      margin: 0 4px;
      font-weight: 300;
    }

    .logo-sub {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,248,236,.55);
    }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--r);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      border: 1px solid transparent;
      line-height: 1;
    }

    .btn-ghost-light {
      background: transparent;
      color: rgba(255,248,236,.7);
      border-color: rgba(255,248,236,.2);
    }
    .btn-ghost-light:hover {
      background: rgba(255,248,236,.1);
      color: var(--cream);
      border-color: rgba(255,248,236,.35);
    }

    .btn-gold {
      background: var(--gold);
      color: var(--green);
      border-color: var(--gold);
      font-weight: 600;
    }
    .btn-gold:hover { background: var(--gold-light); border-color: var(--gold-light); }

    .btn-green {
      background: var(--green);
      color: var(--cream);
      border-color: var(--green);
      font-weight: 600;
    }
    .btn-green:hover { background: var(--green-2); border-color: var(--green-2); }

    .btn-outline {
      background: transparent;
      color: var(--text-2);
      border-color: var(--border-mid);
    }
    .btn-outline:hover { background: var(--surface-2); color: var(--text-1); border-color: var(--border-strong); }

    .btn-danger-outline {
      background: transparent;
      color: var(--error);
      border-color: rgba(88,39,39,.3);
    }
    .btn-danger-outline:hover { background: rgba(88,39,39,.06); }

    /* ── Main ───────────────────────────────────────────── */
    main {
      flex: 1;
      padding: 36px 28px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Category tabs ──────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 2px;
      background: rgba(33,46,29,.07);
      padding: 3px;
      border-radius: var(--r-lg);
      border: 1px solid var(--border-mid);
      width: fit-content;
      margin-bottom: 32px;
    }

    .tab {
      padding: 8px 18px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: all .15s;
      border: 1px solid transparent;
      background: transparent;
      font-family: var(--sans);
      white-space: nowrap;
    }
    .tab:hover { color: var(--green); background: rgba(33,46,29,.05); }
    .tab.active {
      background: var(--green);
      color: var(--cream);
      border-color: var(--green);
      box-shadow: 0 1px 4px rgba(33,46,29,.2);
    }

    /* ── Bookmark grid ──────────────────────────────────── */
    .bookmark-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }

    .bookmark-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border-mid);
      border-radius: var(--r-lg);
      text-decoration: none;
      color: var(--text-1);
      transition: all .15s;
      min-width: 0;
      box-shadow: 0 1px 3px rgba(33,46,29,.06);
    }
    .bookmark-card:hover {
      border-color: var(--green);
      box-shadow: 0 3px 12px rgba(33,46,29,.12);
      transform: translateY(-1px);
    }

    .bookmark-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bookmark-icon img { width: 24px; height: 24px; object-fit: contain; }
    .bookmark-icon .fl {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
    }

    .bookmark-info { min-width: 0; flex: 1; }
    .bookmark-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bookmark-url {
      font-size: 11px;
      font-family: monospace;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .bookmark-arrow {
      flex-shrink: 0;
      color: var(--gold);
      opacity: 0;
      transition: opacity .15s;
    }
    .bookmark-card:hover .bookmark-arrow { opacity: 1; }

    .empty-state {
      text-align: center;
      padding: 72px 20px;
      color: var(--text-3);
      font-size: 13px;
      grid-column: 1/-1;
    }
    .empty-state strong { display: block; color: var(--text-2); margin-bottom: 6px; font-size: 15px; font-family: var(--serif); }

    /* ── Admin panel ────────────────────────────────────── */
    .admin-overlay {
      position: fixed;
      inset: 0;
      background: rgba(33,46,29,.45);
      backdrop-filter: blur(3px);
      z-index: 200;
      display: none;
      align-items: flex-start;
      justify-content: flex-end;
    }
    .admin-overlay.open { display: flex; }

    .admin-panel {
      width: 520px;
      max-width: 100vw;
      height: 100vh;
      background: var(--cream);
      border-left: 1px solid var(--border-mid);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideIn .2s ease;
    }

    @keyframes slideIn {
      from { transform: translateX(24px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-mid);
      background: var(--green);
      flex-shrink: 0;
    }

    .admin-title {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--cream);
      letter-spacing: .04em;
    }

    .admin-body {
      flex: 1;
      overflow-y: auto;
      padding: 22px 24px;
      background: var(--cream);
    }

    /* ── Form ───────────────────────────────────────────── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border-mid);
      border-radius: var(--r-lg);
      padding: 20px;
      margin-bottom: 22px;
      box-shadow: 0 1px 4px rgba(33,46,29,.06);
    }

    .form-card-title {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .form-row { margin-bottom: 13px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 5px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      background: var(--cream);
      border: 1px solid var(--border-mid);
      border-radius: var(--r);
      color: var(--text-1);
      font-family: var(--sans);
      font-size: 13px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(33,46,29,.08);
    }

    .checkbox-group { display: flex; flex-wrap: wrap; gap: 6px; }

    .cat-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 5px 11px;
      background: var(--cream);
      border: 1px solid var(--border-mid);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
      transition: all .15s;
      user-select: none;
    }
    .cat-toggle:hover { border-color: var(--green); color: var(--green); }
    .cat-toggle.checked {
      background: var(--green);
      border-color: var(--green);
      color: var(--cream);
    }
    .cat-toggle input { display: none; }

    .icon-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }
    .icon-preview-box {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--cream-3);
      border: 1px solid var(--border-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .icon-preview-box img { width: 26px; height: 26px; object-fit: contain; }
    .icon-preview-status { font-size: 12px; color: var(--text-3); }

    .form-actions { display: flex; gap: 8px; margin-top: 18px; }

    /* ── Admin bookmark list ────────────────────────────── */
    .section-label {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 12px;
    }

    .admin-filter {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-chip {
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--sans);
      border: 1px solid var(--border-mid);
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: all .15s;
      letter-spacing: .02em;
    }
    .filter-chip.active {
      background: var(--green);
      border-color: var(--green);
      color: var(--cream);
    }

    .bm-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 6px;
      transition: border-color .15s;
    }
    .bm-row:hover { border-color: var(--border-mid); }

    .bm-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--cream-3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .bm-icon img { width: 18px; height: 18px; object-fit: contain; }
    .bm-icon .fl {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
    }

    .bm-info { flex: 1; min-width: 0; }
    .bm-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bm-domain {
      font-size: 11px;
      color: var(--text-3);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bm-cats { display: flex; gap: 3px; flex-shrink: 0; }
    .cat-pip {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(33,46,29,.07);
      color: var(--text-2);
      border: 1px solid var(--border);
      letter-spacing: .01em;
    }

    .bm-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 5px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      transition: all .15s;
    }
    .icon-btn:hover { background: var(--surface-2); border-color: var(--border); color: var(--text-1); }
    .icon-btn.del:hover { color: var(--error); border-color: rgba(88,39,39,.25); background: rgba(88,39,39,.05); }

    .divider { border: none; border-top: 1px solid var(--border-mid); margin: 22px 0; }

    /* ── Gold star motif (brand texture accent) ─────────── */
    .star-accent {
      color: var(--gold);
      font-size: 10px;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* ── Toast ──────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .toast {
      padding: 10px 16px;
      background: var(--green);
      border: 1px solid var(--green-2);
      border-radius: var(--r);
      font-size: 13px;
      font-weight: 500;
      color: var(--cream);
      animation: toastIn .2s ease;
    }
    @keyframes toastIn {
      from { transform: translateY(8px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    @media (max-width: 600px) {
      .admin-panel { width: 100vw; }
      main { padding: 20px 16px; }
      header { padding: 0 16px; }
      .tabs { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <a href="/" class="logo">
      <span style="color:#CD9B49;font-size:20px;line-height:1;">✦</span>
      <span>
        <span class="logo-wordmark">Encore Pro</span>
        <span class="logo-sep">/</span>
        <span class="logo-sub">Internal Links</span>
      </span>
    </a>
    <div class="header-right">
      <button class="btn btn-ghost-light" onclick="openAdmin()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="2.5"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M11.54 3.05l-1.41 1.41M4.46 11.54l-1.41 1.41"/>
        </svg>
        Admin
      </button>
    </div>
  </header>

  <main>
    <div class="tabs" id="tabs"></div>
    <div class="bookmark-grid" id="bookmark-grid"></div>
  </main>

</div>

<!-- Admin overlay -->
<div class="admin-overlay" id="admin-overlay" onclick="handleOverlayClick(event)">
  <div class="admin-panel">

    <div class="admin-header">
      <span class="admin-title">Manage Bookmarks</span>
      <button class="btn btn-ghost-light" onclick="closeAdmin()" style="padding:5px 10px;font-size:12px;">✕ Close</button>
    </div>

    <div class="admin-body">

      <div class="form-card">
        <div class="form-card-title" id="form-section-title">Add Bookmark</div>

        <div class="form-row">
          <label>Name</label>
          <input type="text" id="f-name" placeholder="HubSpot" />
        </div>

        <div class="form-row">
          <label>URL</label>
          <input type="text" id="f-url" placeholder="app.hubspot.com" oninput="debounceIconPreview()" />
        </div>

        <div class="form-row">
          <label>Categories</label>
          <div class="checkbox-group" id="cat-checkboxes"></div>
        </div>

        <div class="form-row">
          <label>Icon preview</label>
          <div class="icon-preview">
            <div class="icon-preview-box" id="icon-preview-box">
              <span style="font-size:18px;color:var(--border-mid)">·</span>
            </div>
            <span class="icon-preview-status" id="icon-preview-status">Enter a URL above</span>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-green" onclick="saveBookmark()">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l4 4 6-7"/></svg>
            Save
          </button>
          <button class="btn btn-outline" onclick="resetForm()" id="cancel-btn" style="display:none;">Cancel</button>
        </div>
      </div>

      <hr class="divider" />

      <div class="section-label">All Bookmarks</div>

      <div class="admin-filter" id="admin-filter"></div>

      <div id="admin-bookmark-list"></div>

    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
const CATEGORIES = ['Product', 'Growth', 'Operations', 'Client Success'];
const STORAGE_KEY = 'ep_bookmarks_v2';

let bookmarks = [];
let editingId = null;
let activeTab = 'all';
let adminFilter = 'all';

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    bookmarks = raw ? JSON.parse(raw) : seeds();
  } catch { bookmarks = seeds(); }
}

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks)); }

function seeds() {
  return [
    { id: uid(), name: 'HubSpot',         url: 'app.hubspot.com',        categories: ['Client Success', 'Growth'] },
    { id: uid(), name: 'Google Analytics', url: 'analytics.google.com',  categories: ['Growth'] },
    { id: uid(), name: 'Notion',           url: 'notion.so',              categories: ['Operations', 'Product'] },
    { id: uid(), name: 'Slack',            url: 'slack.com',              categories: ['Operations', 'Client Success', 'Product', 'Growth'] },
    { id: uid(), name: 'GitHub',           url: 'github.com',             categories: ['Product'] },
    { id: uid(), name: 'Figma',            url: 'figma.com',              categories: ['Product'] },
    { id: uid(), name: 'Google Drive',     url: 'drive.google.com',       categories: ['Operations', 'Client Success'] },
    { id: uid(), name: 'Linear',           url: 'linear.app',             categories: ['Product'] },
    { id: uid(), name: 'Loom',             url: 'loom.com',               categories: ['Operations', 'Client Success'] },
    { id: uid(), name: 'Confluence',       url: 'confluence.atlassian.com', categories: ['Operations', 'Product'] },
  ];
}

function uid() { return Math.random().toString(36).slice(2, 10); }

function getDomain(url) {
  let u = url.trim().replace(/^https?:\/\//i, '');
  return u.split('/')[0];
}

function iconUrl(url) {
  const d = getDomain(url);
  return d ? `https://www.google.com/s2/favicons?domain=${d}&sz=64` : null;
}

/* ── Render ───────────────────────────────────────────── */
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = ['all', ...CATEGORIES].map(cat => `
    <button class="tab ${activeTab === cat ? 'active' : ''}" onclick="setTab('${cat}')">
      ${cat === 'all' ? 'All' : cat}
    </button>
  `).join('');
}

function setTab(cat) { activeTab = cat; renderTabs(); renderGrid(); }

function renderGrid() {
  const grid = document.getElementById('bookmark-grid');
  const list = activeTab === 'all' ? bookmarks : bookmarks.filter(b => b.categories.includes(activeTab));

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><strong>Nothing here yet.</strong>Open Admin to add bookmarks.</div>`;
    return;
  }

  grid.innerHTML = list.map(b => {
    const icon = iconUrl(b.url);
    const letter = b.name[0];
    const href = b.url.startsWith('http') ? b.url : 'https://' + b.url;
    return `
      <a class="bookmark-card" href="${href}" target="_blank" rel="noopener">
        <div class="bookmark-icon">
          ${icon
            ? `<img src="${icon}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><span class="fl" style="display:none">${letter}</span>`
            : `<span class="fl">${letter}</span>`}
        </div>
        <div class="bookmark-info">
          <div class="bookmark-name">${esc(b.name)}</div>
          <div class="bookmark-url">${esc(getDomain(b.url))}</div>
        </div>
        <svg class="bookmark-arrow" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 8h10M9 4l4 4-4 4"/>
        </svg>
      </a>`;
  }).join('');
}

/* ── Admin ────────────────────────────────────────────── */
function openAdmin() {
  document.getElementById('admin-overlay').classList.add('open');
  buildCatBoxes();
  renderAdminFilter();
  renderAdminList();
}
function closeAdmin() {
  document.getElementById('admin-overlay').classList.remove('open');
  resetForm();
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('admin-overlay')) closeAdmin();
}

function buildCatBoxes(sel = []) {
  document.getElementById('cat-checkboxes').innerHTML = CATEGORIES.map(cat => {
    const on = sel.includes(cat);
    return `
      <label class="cat-toggle ${on ? 'checked' : ''}" onclick="toggleCat(this)">
        <input type="checkbox" value="${cat}" ${on ? 'checked' : ''} />
        ✦ ${cat}
      </label>`;
  }).join('');
}

function toggleCat(label) {
  setTimeout(() => {
    label.classList.toggle('checked', label.querySelector('input').checked);
  }, 0);
}

function getSelectedCats() {
  return [...document.querySelectorAll('#cat-checkboxes input:checked')].map(i => i.value);
}

function renderAdminFilter() {
  document.getElementById('admin-filter').innerHTML = ['all', ...CATEGORIES].map(cat => `
    <button class="filter-chip ${adminFilter === cat ? 'active' : ''}" onclick="setAdminFilter('${cat}')">
      ${cat === 'all' ? 'All' : cat}
    </button>`).join('');
}

function setAdminFilter(cat) { adminFilter = cat; renderAdminFilter(); renderAdminList(); }

function renderAdminList() {
  const list = document.getElementById('admin-bookmark-list');
  const filtered = adminFilter === 'all' ? bookmarks : bookmarks.filter(b => b.categories.includes(adminFilter));

  if (!filtered.length) {
    list.innerHTML = `<div style="color:var(--text-3);font-size:13px;padding:16px 0;">No bookmarks found.</div>`;
    return;
  }

  list.innerHTML = filtered.map(b => {
    const icon = iconUrl(b.url);
    const letter = b.name[0];
    const cats = b.categories.map(c => `<span class="cat-pip">${c}</span>`).join('');
    return `
      <div class="bm-row">
        <div class="bm-icon">
          ${icon
            ? `<img src="${icon}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><span class="fl" style="display:none">${letter}</span>`
            : `<span class="fl">${letter}</span>`}
        </div>
        <div class="bm-info">
          <div class="bm-name">${esc(b.name)}</div>
          <div class="bm-domain">${esc(getDomain(b.url))}</div>
        </div>
        <div class="bm-cats">${cats}</div>
        <div class="bm-actions">
          <button class="icon-btn" title="Edit" onclick="editBookmark('${b.id}')">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.5 2.5l2 2L5 13l-3 .5.5-3 9-8z"/></svg>
          </button>
          <button class="icon-btn del" title="Delete" onclick="deleteBookmark('${b.id}')">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 10h8l1-10"/></svg>
          </button>
        </div>
      </div>`;
  }).join('');
}

/* ── Form ─────────────────────────────────────────────── */
let iconTimer = null;
function debounceIconPreview() {
  clearTimeout(iconTimer);
  iconTimer = setTimeout(updateIconPreview, 600);
}

function updateIconPreview() {
  const url = document.getElementById('f-url').value.trim();
  const box = document.getElementById('icon-preview-box');
  const status = document.getElementById('icon-preview-status');
  if (!url) {
    box.innerHTML = `<span style="font-size:18px;color:var(--border-mid)">·</span>`;
    status.textContent = 'Enter a URL above';
    status.style.color = '';
    return;
  }
  const src = iconUrl(url);
  if (!src) return;
  const img = new Image();
  img.onload = () => {
    box.innerHTML = `<img src="${src}" alt="" />`;
    status.textContent = 'Icon found';
    status.style.color = '#1e7d4a';
  };
  img.onerror = () => {
    box.innerHTML = `<span class="fl" style="font-size:14px">${url[0]?.toUpperCase() || '?'}</span>`;
    status.textContent = 'No icon — will use initial';
    status.style.color = 'var(--text-3)';
  };
  img.src = src;
}

function saveBookmark() {
  const name = document.getElementById('f-name').value.trim();
  const url  = document.getElementById('f-url').value.trim();
  const cats = getSelectedCats();
  if (!name || !url) { toast('Name and URL are required.'); return; }
  if (!cats.length)  { toast('Select at least one category.'); return; }

  if (editingId) {
    const i = bookmarks.findIndex(b => b.id === editingId);
    if (i !== -1) bookmarks[i] = { ...bookmarks[i], name, url, categories: cats };
    toast(`Updated "${name}"`);
  } else {
    bookmarks.push({ id: uid(), name, url, categories: cats });
    toast(`Added "${name}"`);
  }
  save(); resetForm(); renderAdminList(); renderGrid();
}

function editBookmark(id) {
  const b = bookmarks.find(x => x.id === id);
  if (!b) return;
  editingId = id;
  document.getElementById('f-name').value = b.name;
  document.getElementById('f-url').value = b.url;
  document.getElementById('form-section-title').textContent = 'Edit Bookmark';
  document.getElementById('cancel-btn').style.display = 'inline-flex';
  buildCatBoxes(b.categories);
  updateIconPreview();
  document.getElementById('f-name').focus();
  document.querySelector('.admin-body').scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteBookmark(id) {
  const b = bookmarks.find(x => x.id === id);
  if (!b || !confirm(`Remove "${b.name}"?`)) return;
  bookmarks = bookmarks.filter(x => x.id !== id);
  save(); renderAdminList(); renderGrid();
  toast(`Removed "${b.name}"`);
}

function resetForm() {
  editingId = null;
  document.getElementById('f-name').value = '';
  document.getElementById('f-url').value = '';
  document.getElementById('form-section-title').textContent = 'Add Bookmark';
  document.getElementById('cancel-btn').style.display = 'none';
  document.getElementById('icon-preview-box').innerHTML = `<span style="font-size:18px;color:var(--border-mid)">·</span>`;
  document.getElementById('icon-preview-status').textContent = 'Enter a URL above';
  document.getElementById('icon-preview-status').style.color = '';
  buildCatBoxes([]);
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
renderTabs();
renderGrid();
</script>
</body>
</html>
